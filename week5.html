<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  grid-template-columns: 120px auto 200px;
  grid-template-rows: 80px 200px;  
  background-color: rgb(30, 255, 131);
  padding: 5px;
  gap: 5px;  
}
.container div {
  background-color: #f1f1f1;
  color:#000;
  padding: 10px;
  font-size: 30px;
  text-align: center;
}
.footer {
  grid-column: 1 / 4;
  background-color: #777;
}
</style>
</head>
<body>
    
<div class="container">
  <div>nav bar</div>
  <div>main content</div>
  <div>Advertisement</div>  
  <div>home contact about email 
  </div>
  <div>contents</div>
  <div>links</div>
  <div class="footer">footer</div>
</div>
</body>
</html>
